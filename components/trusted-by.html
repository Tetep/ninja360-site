<!-- TRUSTED BY - client logo strip for the home page.
     ============================================================================
     ACTIVE VARIANT: LOGOS. Variant A (text wordmarks) is kept commented at the
     bottom as the zero-asset fallback.

     BEFORE THIS GOES LIVE: every src below is a REPLACE-GHL-URL-* token. Upload
     the white PNG exports to GHL Media and swap each one. Any token left
     unswapped hides itself (onerror), so a partial upload degrades cleanly - it
     will NOT put broken images back on the page. But a strip with 3 of 14 logos
     showing looks worse than the text variant, so if fewer than ~8 are ready,
     ship Variant A instead and come back to this.

     WHY THIS FILE EXISTS: the previous strip hot-linked 5 logos from
     ninja-360.com/wp-content/uploads/2024/08/ - that Wix site is NOT live (the
     domain is email-only now), so all five 404 and the home page has been
     rendering broken images. Never point at ninja-360.com again.
     Sourcing + Canva spec: client-logo-stockpile-V01.md.

     STYLE SPEC (matches the original strip):
       54px render (42px mobile) | filter brightness(0) invert(1)
       opacity .8, hover 1.0 | gap 64px (mobile 42px) | background #13161c
       edge fade: transparent -> opaque at 8%, opaque -> transparent at 92%
       list duplicated once for the seamless -50% scroll loop - keep both in sync

     ORDER: national and local are deliberately interleaved rather than clustered.
     Big names grouped together read as padding; alternating reads as range.

     ROSTER - the relationship, on the record:
     Tim works these accounts as a SUBCONTRACTOR (confirmed 2026-09-29). The work is real;
     the brands did not hire Ninja-360 directly. That is the whole reason "Trusted by" walks
     a line - it implies a direct client relationship. RESOLVED: the label now reads
     "Brands we've shot for", which is true of subcontracted capture work. Every logo stays.
     ONE THING TO CHECK - a contract question, not a legal opinion: subcontracts in national
     retail capture work often carry a publicity or confidentiality clause restricting naming
     the end client in your own marketing. Worth scanning whatever you signed with the
     intermediary before these publish. That is the likelier snag, not trademark.
     ============================================================================ -->

<style>
.tb-wrap{background:#13161c;padding:28px 0;overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 8%,#000 92%,transparent 100%);
          mask-image:linear-gradient(to right,transparent 0,#000 8%,#000 92%,transparent 100%)}
.tb-label{max-width:1080px;margin:0 auto 18px;padding:0 22px;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:#FF8D2D;font-weight:800}
.tb-track{display:flex;align-items:center;gap:64px;width:max-content;
  animation:tb-scroll 52s linear infinite}
.tb-wrap:hover .tb-track{animation-play-state:paused}
.tb-track img{flex:0 0 auto;height:54px;width:auto;opacity:.8;
  filter:brightness(0) invert(1);transition:opacity .2s}
.tb-track img:hover{opacity:1}
.tb-track b{flex:0 0 auto;color:#fff;opacity:.8;font-size:19px;font-weight:700;
  letter-spacing:.03em;white-space:nowrap;transition:opacity .2s}
.tb-track b:hover{opacity:1}
@keyframes tb-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(max-width:780px){
  .tb-track{gap:42px}
  .tb-track img{height:42px}
  .tb-track b{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  .tb-track{animation:none;flex-wrap:wrap;width:auto;justify-content:center;
    max-width:1080px;margin:0 auto;padding:0 22px;gap:28px 42px}
  .tb-wrap{-webkit-mask-image:none;mask-image:none}
}
