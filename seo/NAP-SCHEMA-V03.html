<!-- ===========================================================================
     Ninja 360 — SITE-WIDE ENTITY SCHEMA V03  (NAP + Organization/LocalBusiness)
     Paste into EVERY page's HEAD in GHL: Page Settings -> Custom Code -> Head.
     Paste it identically on every page — identical @id is what makes search
     engines MERGE the pages into one entity instead of splitting it.
     Supersedes the EVERY PAGE block in seo/HEAD-SCHEMA.md and
     seo/home-organization-schema-V01.html.

     WHY ONE NODE AND NOT TWO:
     The source instruction asked for an Organization node (#organization) plus a
     separate LocalBusiness node (#localbusiness). That is the split-entity bug
     this repo already ruled against (seo/HEAD-SCHEMA.md -> "ENTITY @id — ONE
     VALUE SITEWIDE"). ProfessionalService IS a subtype of LocalBusiness, which
     is itself a subtype of Organization, so ONE node typed as both carries every
     property both were going to carry, under the one id the rest of the site
     already references: https://ninja360.net/#org

     PHONE: (844) 360-6465 is the canonical, dialable NAP string and the only
     form that goes in markup. 844-360-NINJA is the marketing spelling and lives
     in visible copy only — never in "telephone", never in a tel: href.

     DO NOT add aggregateRating / Review here. Self-serving review markup on your
     own domain violates Google's guidelines. Reviews stay in the Zyene widget.
     =========================================================================== -->
